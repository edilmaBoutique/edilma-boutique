<script>
function formatarTelefone(valor){

    let n = String(valor || "")
        .replace(/\D/g,"")
        .slice(0,11);

    if(!n){
        return "";
    }

    if(n.length <= 2){
        return "(" + n;
    }

    if(n.length <= 6){
        return "(" + n.slice(0,2) + ") " +
            n.slice(2);
    }

    if(n.length <= 10){
        return "(" + n.slice(0,2) + ") " +
            n.slice(2,6) + "-" +
            n.slice(6);
    }

    return "(" + n.slice(0,2) + ") " +
        n.slice(2,7) + "-" +
        n.slice(7);
}

function formatarMoeda(valor){

    return Number(valor || 0).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );
}


/* =========================================================
   DATA
========================================================= */

function formatarData(data){

    if(!data){
        return "";
    }

    const partes = data.split("-");

    if(partes.length !== 3){
        return data;
    }

    return partes[2] + "/" +
        partes[1] + "/" +
        partes[0];
}


/* =========================================================
   ADICIONAR MESES
========================================================= */

function escaparHTML(valor){

    return String(valor || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

/* =========================================================
   EDILMA BOUTIQUE — PAINEL
========================================================= */

function gerarPix(chave, valor) {

    function campo(id, valor) {

        valor = String(valor);

        return (
            id +
            valor.length.toString().padStart(2, "0") +
            valor
        );
    }


    function crc16(payload) {

        let crc = 0xFFFF;

        for (let i = 0; i < payload.length; i++) {

            crc ^= payload.charCodeAt(i) << 8;

            for (let j = 0; j < 8; j++) {

                if (crc & 0x8000) {

                    crc =
                        ((crc << 1) ^ 0x1021) &
                        0xFFFF;

                } else {

                    crc =
                        (crc << 1) &
                        0xFFFF;
                }
            }
        }

        return crc
            .toString(16)
            .toUpperCase()
            .padStart(4, "0");
    }


    /* =========================================
       CHAVE PIX
    ========================================= */

    chave = String(chave || "").trim();


    if (!chave) {
        throw new Error(
            "Chave PIX não cadastrada."
        );
    }


    /* =========================================
       VALOR
    ========================================= */

    const valorNumerico =
        Number(valor);


    if (
        !Number.isFinite(valorNumerico) ||
        valorNumerico <= 0
    ) {

        throw new Error(
            "Valor do PIX inválido."
        );
    }


    const valorFormatado =
        valorNumerico.toFixed(2);


    /* =========================================
       MERCHANT ACCOUNT INFORMATION
    ========================================= */

    const merchantAccountInformation =
        campo(
            "00",
            "BR.GOV.BCB.PIX"
        ) +
        campo(
            "01",
            chave
        );


    /* =========================================
       PAYLOAD PIX
    ========================================= */

    let payload = "";


    /* Payload Format Indicator */

    payload += campo(
        "00",
        "01"
    );


    /* Merchant Account Information */

    payload += campo(
        "26",
        merchantAccountInformation
    );


    /* Merchant Category Code */

    payload += campo(
        "52",
        "0000"
    );


    /* Transaction Currency */

    payload += campo(
        "53",
        "986"
    );


    /* Transaction Amount */

    payload += campo(
        "54",
        valorFormatado
    );


    /* Country Code */

    payload += campo(
        "58",
        "BR"
    );


    /* Merchant Name */

    payload += campo(
        "59",
        "Edilma Boutique"
    );


    /* Merchant City */

    payload += campo(
        "60",
        "LONDRINA"
    );


    /* =========================================
       ADDITIONAL DATA FIELD
    ========================================= */

    const campo62 =
        campo(
            "05",
            "***"
        );


    payload += campo(
        "62",
        campo62
    );


    /* =========================================
       CRC
    ========================================= */

    payload += "6304";


    const crc =
        crc16(payload);


    return payload + crc;
}


/* =========================================================
   COPIAR PIX
========================================================= */

async function copiarPix(){

    if(!window.pixAtual){
        return;
    }


    try{

        await navigator.clipboard.writeText(
            window.pixAtual
        );


        const botao =
            document.querySelector(
                ".copiar"
            );


        if(botao){

            const textoOriginal =
                botao.innerText;


            botao.innerText =
                "PIX COPIADO!";


            setTimeout(
                function(){

                    botao.innerText =
                        textoOriginal;

                },
                2000
            );
        }


    }catch(e){

        alert(
            "Não foi possível copiar automaticamente. Selecione o código PIX manualmente."
        );
    }
}

/* =================================================

            new Date(
                agora.getFullYear(),
                agora.getMonth(),
                agora.getDate()
            );
        
        
        const inicioVencimento =
            new Date(
                vencimento.getFullYear(),
                vencimento.getMonth(),
                vencimento.getDate()
            );
        
        
        if (inicioHoje > inicioVencimento) {
        
            const diferenca =
                inicioHoje.getTime() -
                inicioVencimento.getTime();
        
            diasAtraso =
                Math.floor(
                    diferenca /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );
        
        }
        
        
        if (diasAtraso < 0) {
            diasAtraso = 0;
        }
        
        
        console.log(
            "DIAS DE ATRASO CALCULADOS:",
            diasAtraso
        );


        const valorOriginal =
            Number(dados.valor || 0);
        console.log(
            "DIAS DE ATRASO CALCULADOS:",
            diasAtraso
        );

        let valorMulta = 0;
        let valorJuros = 0;


        if(diasAtraso > 0){

            valorMulta =
                valorOriginal *
                (
                    Number(dados.multa || 0) /
                    100
                );


            valorJuros =
                valorOriginal *
                (
                    Number(dados.juros || 0) /
                    100
                ) *
                diasAtraso;
        }


        valorMulta =
            Math.round(
                valorMulta * 100
            ) / 100;


        valorJuros =
            Math.round(
                valorJuros * 100
            ) / 100;


        const valorTotal =
            Math.round(
                (
                    valorOriginal +
                    valorMulta +
                    valorJuros
                ) * 100
            ) / 100;


        /* =================================================
           PIX
        ================================================= */

        const pixCopiaECola =
            gerarPix(
                dados.pix,
                valorTotal
            );


        const qrContainer =
            document.createElement("div");

        qrContainer.style.position =
            "absolute";

        qrContainer.style.left =
            "-99999px";

        document.body.appendChild(
            qrContainer
        );


        new QRCode(
            qrContainer,
            {
                text:pixCopiaECola,
                width:500,
                height:500,
                correctLevel:
                    QRCode.CorrectLevel.M
            }
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );


        const canvas =
            qrContainer.querySelector(
                "canvas"
            );


        const qrData =
            canvas.toDataURL(
                "image/png"
            );


        document.body.removeChild(
            qrContainer
        );


        /* =================================================
           EXIBIR
        ================================================= */

        status.innerText =
            diasAtraso > 0
                ? "Esta parcela está em atraso."
                : "Parcela em dia.";


        let html = "";


        html += `
            <div class="resumo">

                <div class="item">
                    <span>Cliente</span>
                    <strong>
                        ${escaparHTML(
                            dados.cliente || "-"
                        )}
                    </strong>
                </div>

                <div class="item">
                    <span>Parcela</span>
                    <strong>
                        ${escaparHTML(
                            dados.parcela || "-"
                        )}
                    </strong>
                </div>

                <div class="item">
                    <span>Vencimento</span>
                    <strong>
                        ${formatarData(
                            dados.vencimento
                        )}
                    </strong>
                </div>

                ${
                    dados.telefone
                    ?
                    `
                    <div class="item">
                        <span>Telefone</span>
                        <strong>
                            ${escaparHTML(
                                formatarTelefone(
                                    dados.telefone
                                )
                            )}
                        </strong>
                    </div>
                    `
                    :
                    ""
                }

                ${
                    diasAtraso > 0
                    ?
                    `
                    <div class="item">
                        <span>Dias em atraso</span>
                        <strong>
                            ${diasAtraso}
                        </strong>
                    </div>

                    <div class="item">
                        <span>Valor original</span>
                        <strong>
                            ${formatarMoeda(
                                valorOriginal
                            )}
                        </strong>
                    </div>

                    <div class="item">
                        <span>Multa</span>
                        <strong>
                            ${formatarMoeda(
                                valorMulta
                            )}
                        </strong>
                    </div>

                    <div class="item">
                        <span>Juros</span>
                        <strong>
                            ${formatarMoeda(
                                valorJuros
                            )}
                        </strong>
                    </div>
                    `
                    :
                    ""
                }

                <div class="item total">
                    <span>Total para pagamento</span>
                    <strong>
                        ${formatarMoeda(
                            valorTotal
                        )}
                    </strong>
                </div>

            </div>
        `;


        html += `
            <div class="qr-area">

                <img
                    src="${qrData}"
                    style="
                        width:240px;
                        height:240px;
                        display:block;
                        margin:auto;
                    "
                >

                <div
                    style="
                        color:#111;
                        font-weight:bold;
                        margin-top:12px;
                    "
                >
                    PIX
                </div>

                <div
                    style="
                        color:#555;
                        font-size:13px;
                        margin-top:5px;
                    "
                >
                    Escaneie o QR Code para pagar
                    ${formatarMoeda(valorTotal)}.
                </div>

            </div>
        `;


        html += `
            <div class="pix-box">

                <label>
                    PIX COPIA E COLA
                </label>

                <div
                    class="pix-code"
                    id="pixCodigo"
                >
                    ${escaparHTML(
                        pixCopiaECola
                    )}
                </div>

                <button
                    class="copiar"
                    onclick="copiarPix()"
                >
                    COPIAR PIX
                </button>

            </div>
        `;


        conteudo.innerHTML = html;


        window.pixAtual =
            pixCopiaECola;


    }catch(erro){

        console.error(erro);

        status.innerText = "";

        conteudo.innerHTML = `
            <div class="erro">
                ${
                    escaparHTML(
                        erro.message ||
                        "Não foi possível carregar esta cobrança."
                    )
                }
            </div>
        `;
    }
}

async function abrirPaginaCarne(codigo) {

    const login =
        document.getElementById("paginaLogin");

    const admin =
        document.getElementById("paginaAdmin");

    const gerador =
        document.getElementById("paginaGerador");

    const pagamento =
        document.getElementById("paginaPagamento");

    const carnePagina =
        document.getElementById("paginaCarneDigital");


    if (login) {
        login.style.display = "none";
    }

    if (admin) {
        admin.style.display = "none";
    }

    }

    }

        carnePagina.style.display = "block";
    }


    await carregarCarneDigital(codigo);

}


/* =========================================================
   CARREGAR CARNÊ
========================================================= */

async function carregarCarneDigital(codigo) {

    const carregando =
        document.getElementById(
            "carneDigitalCarregando"
        );

    const erro =
        document.getElementById(
            "carneDigitalErro"
        );

    const conteudo =
        document.getElementById(
            "carneDigitalConteudo"
        );


    carregando.style.display =
        "block";

    erro.style.display =
        "none";

    conteudo.style.display =
        "none";


    try {

        const resposta =
            await fetch(
                `/api/cobranca?carne=${encodeURIComponent(codigo)}`
            );


        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado?.erro ||
                resultado?.error ||
                "Não foi possível carregar o carnê."
            );

        }


        console.log(
            "Carnê recebido:",
            resultado
        );


        /* =================================================
           CLIENTE
        ================================================= */

        const cliente =
            resultado.cliente ||
            resultado.clienteData ||
            {};


        document.getElementById(
            "carneClienteNome"
        ).textContent =
            cliente.nome ||
            resultado.nome ||
            "Cliente";


        document.getElementById(
            "carneClienteDocumento"
        ).textContent =
            cliente.cpf_cnpj
                ? "CPF/CNPJ: " +
                  cliente.cpf_cnpj
                : "";


        document.getElementById(
            "carneClienteTelefone"
        ).textContent =
            cliente.telefone
                ? "Telefone: " +
                  cliente.telefone
                : "";


        /* =================================================
           PARCELAS
        ================================================= */

        const parcelas =
            resultado.parcelas ||
            resultado.data?.parcelas ||
            [];


        const lista =
            document.getElementById(
                "carneListaParcelas"
            );


        lista.innerHTML = "";


        let totalAberto = 0;
        let atrasadas = 0;
        let abertas = 0;


        if (
            !parcelas ||
            parcelas.length === 0
        ) {

            lista.innerHTML = `
                <div class="carne-vazia">
                    Nenhuma parcela encontrada.
                </div>
            `;

        } else {

            parcelas.forEach(
                parcela => {

                    const valor =
                        Number(
                            parcela.valor ||
                            parcela.valor_original ||
                            0
                        );


                    const valorPago =
                        Number(
                            parcela.valor_pago ||
                            0
                        );


                    const saldo =
                        Math.max(
                            valor -
                            valorPago,
                            0
                        );


                    const status =
                        String(
                            parcela.status ||
                            ""
                        )
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(
                            /[\u0300-\u036f]/g,
                            ""
                        );


                    const paga =
                        status.includes("pago") ||
                        status.includes("quitado") ||
                        saldo <= 0;


                    let atrasada =
                        false;


                    if (
                        parcela.vencimento &&
                        !paga
                    ) {

                        const hoje =
                            new Date();

                        const vencimento =
                            new Date(
                                parcela.vencimento +
                                "T23:59:59"
                            );


                        atrasada =
                            vencimento <
                            hoje;

                    }


                    if (!paga) {

                        abertas++;

                        totalAberto +=
                            saldo;

                    }


                    if (atrasada) {
                        atrasadas++;
                    }


                    let statusTexto =
                        "EM ABERTO";

                    let statusClasse =
                        "carne-status-aberta";


                    if (paga) {

                        statusTexto =
                            "PAGA";

                        statusClasse =
                            "carne-status-paga";

                    } else if (atrasada) {

                        statusTexto =
                            "ATRASADA";

                        statusClasse =
                            "carne-status-atrasada";

                    }


                    const numero =
                        parcela.numero ||
                        "";


                    const vencimento =
                        parcela.vencimento
                            ? formatarData(
                                parcela.vencimento
                            )
                            : "-";


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "carne-parcela";


                    div.innerHTML = `

                        <div class="carne-parcela-info">

                            <div class="carne-parcela-numero">

                                Parcela ${numero}

                            </div>

                            <div class="carne-parcela-data">

                                Vencimento:
                                ${vencimento}

                            </div>

                        </div>


                        <div class="carne-parcela-valor">

                            <strong>

                                ${formatarMoeda(
                                    saldo
                                )}

                            </strong>


                            <span
                                class="carne-status ${statusClasse}"
                            >

                                ${statusTexto}

                            </span>

                        </div>


                        ${
                            !paga
                            ?
                            `
                            <button
                                class="carne-btn-pagar"
                                onclick="abrirPagamentoParcela('${escaparHTML(String(parcela.id || ""))}')"
                            >
                                PAGAR
                            </button>
                            `
                            :
                            ""
                        }

                    `;


                    lista.appendChild(
                        div
                    );

                }
            );

        }


        /* =================================================
           RESUMO
        ================================================= */

        document.getElementById(
            "carneTotalAberto"
        ).textContent =
            formatarMoeda(
                totalAberto
            );


        document.getElementById(
            "carneQuantidadeParcelas"
        ).textContent =
            abertas;


        document.getElementById(
            "carneQuantidadeAtrasadas"
        ).textContent =
            atrasadas;


        carregando.style.display =
            "none";

        conteudo.style.display =
            "block";


    } catch (e) {

        console.error(
            "Erro ao carregar carnê:",
            e
        );


        carregando.style.display =
            "none";


        erro.textContent =
            e.message ||
            "Não foi possível carregar o carnê.";


        erro.style.display =
            "block";

    }

}


/* =========================================================
   PAGAMENTO DA PARCELA
========================================================= */

async function abrirPagamentoParcela(parcelaId) {

    if (!parcelaId) {
        alert("Parcela não identificada.");
        return;
    }

    try {

        const resposta = await fetch("/api/cobranca", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                acao: "criarTokenParcela",
                parcelaId: String(parcelaId)
            })

        });

        let resultado = null;

        try {
            resultado = await resposta.json();
        } catch (erro) {
            resultado = null;
        }

        if (!resposta.ok) {

            throw new Error(
                resultado && resultado.erro
                    ? resultado.erro
                    : "Não foi possível abrir o pagamento."
            );

        }

        if (
            !resultado ||
            !resultado.sucesso ||
            !resultado.token
        ) {

            throw new Error(
                "Não foi possível gerar o acesso para pagamento."
            );

        }

        /*
         * O backend cria o token.
         * O CARNE_SECRET nunca fica no navegador.
         */

        const token =
            resultado.token;

        /*
         * Abre a página de pagamento
         * sem precisar recarregar o carnê.
         */

        const novaUrl =
            window.location.pathname +
            "?token=" +
            encodeURIComponent(token);

        window.history.pushState(
            {
                token: token
            },
            "",
            novaUrl
        );

        await abrirPaginaPagamento(token);

        window.scrollTo(0, 0);

    } catch (erro) {

        console.error(
            "Erro ao abrir pagamento da parcela:",
            erro
        );

        alert(
            erro.message ||
            "Não foi possível abrir o pagamento."
        );

    }

}

(async function iniciarPaginaPublica() {
    const parametros =
        new URLSearchParams(
            window.location.search
        );
    const token =
        parametros.get("token");
    const carne =
        parametros.get("carne");

    /* Pagamento individual (QR Code do carnê em PDF / botão Pagar) */
    if (token) {
        abrirPaginaPagamento(token);
        return;
    }

    /* Carnê digital */
    if (carne) {
        await abrirPaginaCarne(carne);
    }
})();
